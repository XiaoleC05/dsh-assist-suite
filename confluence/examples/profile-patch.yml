# ---------------------------------------------------------------------------
# Example 4 — debugging a store/memory/pulse problem on one machine.
# Faster polling, a dedicated debug log outside the working directory, a custom
# store directory under DSH_HOME, and only a small injected budget. Keep logFile
# out of version control and never point it at a directory with session content.
# ---------------------------------------------------------------------------
- id: confluence
  name: dsh-confluence
  config:
    enabled: true
    store:
      dir: 'C:\Users\<you>\.dsh\storages\confluence\debug-v1'
      retentionDays: 7
      maxBodyBytes: 8192
      pollMs: 1000
      watch: false
      maxOpenWorkspaces: 4
    bus:
      enabled: true
      context:
        maxKeys: 50
        maxValueBytes: 8192
      notes:
        maxEntries: 200
      messages:
        maxStored: 100
        maxBodyBytes: 4096
      pulse:
        enabled: true
        maxChars: 1400
        maxMessages: 3
        maxStateKeys: 3
        maxPeers: 2
    profile:
      enabled: true
      inject: true
      maxFacts: 200
      maxInjectChars: 1200
      minConfidence: 0.3
      maxValueBytes: 1024
      maxExportBytes: 65536
    memory:
      enabled: true
      inject: true
      maxPatterns: 300
      maxInjectPatterns: 3
      maxInjectChars: 900
      candidateConfidence: 0.5
      autoCapture: candidate
    style:
      enabled: true
      inject: true
      maxRules: 100
      maxInjectCharsChat: 400
      maxInjectCharsEngineering: 600
    ledger:
      enabled: true
      maxFilesPerSession: 8
      maxSessions: 200
      fileHintsInPulse: false
    recall:
      enabled: true
      maxSessions: 3
      maxHits: 5
      timeoutMs: 5000
    privacy:
      redact: true
      redactTitles: true
      redactPatterns: []
      denyPathPatterns:
        - '**/.env*'
        - '**/*.pem'
      privateSessions: []
    ui:
      enabled: true
      pollMs: 5000
    debug:
      logFile: 'C:\Users\<you>\.dsh\logs\confluence-debug.log'

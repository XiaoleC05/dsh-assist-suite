# dsh-assist-suite — 一个 bundle 的完整 loader 行。
#
# 只有一个融合插件行：根 index.js 把 Confluence、pro-prompt 与 Crisp（默认关闭）
# 挂到同一个插件主体上，同时发布合并后的 client.js。
#
# 成员配置是融合配置里的 section：
#   confluence: Confluence 的完整配置（缺省用成员内部默认值）
#   proPrompt:  pro-prompt 的完整配置（缺省用成员内部默认值）
#   crisp:       { enabled: false } —— 设为 true 才加载质量门禁
#
# 行 id 用 assist-core；整组停用用 set_bundle，Crisp 用 config.crisp.enabled 控制。

- insert:
    - id: assist-core
      name: 'dsh-assist-suite'
      config:
        confluence: {}
        proPrompt: {}
        crisp:
          enabled: false
